<app-user-create (createUser)="addUser($event)"></app-user-create>
<app-users-filter (onFilter)="onFilterChange($event)"></app-users-filter>

<p> 
	{{ (filteredUsers$ | async)?.length ?? 0}}
	{{ (filteredUsers$ | async)?.length ?? 0 | plural:'пользователь':'пользователя':'пользователей' }}
</p>
<div class="users-list">
	@for (user of filteredUsers$ | async; track user.id) {
	<app-user-card [user]="user" (deleteUser)="deletUser($event)"></app-user-card>
	} @empty {
	<div class="users-empty">Нет пользователей для отображения</div>
	}
</div>
